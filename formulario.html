<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulario SENA V2 </title>
    <link rel = "stylesheet" href = "style.css"
</head>
<body>
   <h1>FORMULARIO SENA V1</h1>
    <p class="subtitle">GRACIAS POR DEJAR <i>SUS DATOS</i></p>

    <div class="form-container">
        <form>
            <label>NOMBRE</label>
            <input type="text" name="nombre" placeholder="Ingrese su nombre" required>

             <label>E-MAIL</label>
            <input type="text" name="e-mail" placeholder="Ingrese su e-mail" required>

             <label>EDAD</label>
            <input type="number" name="edad" placeholder="Ingrese su edad" required>

            <label>Seleccione una opción</label>
            <select>
                <option>Seleccione una opción</option>
                <option>Opción A</option>
                <option>Opción B</option>
                <option>Opción C</option>
            </select>
            <p>¿Tiene planeado comprar un carro nuevo en los siguiente 5 años?</p>
            <label><input type="radio" name="comprar" value="si">SI</label><br>
            <label><input type="radio" name="comprar" value="no">NO</label><br>
            <label><input type="radio" name="comprar" value="tal vez">TAL VEZ</label><br>

            <label>¿Cuál es tu marca de carro favorita?</label>
            <select>
                <option>Seleccione una opción</option>
                <option>Ford</option>
                <option>Toyota</option>
                <option>Nissan</option>
                <option>BMW</option>
                <option>Chevrolet</option>
            </select>

            <label>¿Qué tipo de medio de transporte tienes?</label>
            <label><input type="checkbox" name="transporte" value="carro">CARRO</label><br>
            <label><input type="checkbox" name="transporte" value="barco">BARCO</label><br>
            <label><input type="checkbox" name="transporte" value="bicicleta">BICICLETA</label><br>
            <label><input type="checkbox" name="transporte" value="moto">MOTO</label><br>
            <label><input type="checkbox" name="transporte" value="avion">AVIÓN</label><br>
            <label><input type="checkbox" name="transporte" value="cicla">CICLA</label><br>

            <label>CUALQUIER COMENTARIO O SUGERENCIA</label>
            <textarea placeholder="POR FAVOR INGRESE SU COMENTARIO AQUI" name="comentario"></textarea>
            <button type="submit">ENVIAR</button>
        </form>
    </div> 
</body>
</html>
